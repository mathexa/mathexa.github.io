<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praxifold</title>
<style>
:root{--bg:#0f1c1a;--panel:#162220;--panel2:#1d2e2c;--border:#283d3a;--text:#e8f4f0;--dim:#8aaca6;--accent:#e8a33d;--accent2:#b9802e;--danger:#d95f5b;--ok:#4caf7d;--r:10px;--font:'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h2,h3{font-weight:700;letter-spacing:-.02em}
.hidden{display:none!important}
.muted{color:var(--dim);font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.card+.card{margin-top:14px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;font-family:var(--font);margin-top:4px;margin-bottom:2px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
select option{background:var(--panel)}
label{display:block;font-size:12px;color:var(--dim);margin-top:12px}
label.inline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);margin-top:12px;cursor:pointer}
label.inline input[type=checkbox]{width:auto;margin:0}
.field{margin-bottom:4px}
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .12s,transform .1s;font-family:var(--font)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#12201e}
.btn-primary:hover:not(:disabled){opacity:.88}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){border-color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 13px;font-size:13px}
.btn-block{width:100%;margin-top:14px}
.alert{padding:11px 14px;border-radius:8px;font-size:14px;margin:10px 0}
.alert-error{background:rgba(217,95,91,.15);border:1px solid var(--danger);color:#f5b0ae}
.alert-ok{background:rgba(76,175,125,.15);border:1px solid var(--ok);color:#a6e2c2}
.alert-info{background:rgba(232,163,61,.1);border:1px solid var(--accent);color:#f2c980}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(15,28,26,.93);backdrop-filter:blur(8px);z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;cursor:pointer}
.brand .dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#f2c374);flex-shrink:0}
.topnav{display:flex;gap:8px;align-items:center}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.lang-toggle button{background:none;border:none;color:var(--dim);padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
.lang-toggle button.active{background:var(--panel2);color:var(--accent)}
main{max-width:1060px;margin:0 auto;padding:30px 18px 80px}
.hero{text-align:center;padding:60px 10px 10px}
.hero h1{font-size:38px;font-weight:800;margin-bottom:10px}
.hero p{color:var(--dim);font-size:16px;margin-bottom:26px}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.sublink{margin-top:18px;font-size:14px;color:var(--dim);cursor:pointer;text-decoration:underline;display:inline-block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:none;color:var(--dim);padding:10px 15px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--font)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:540px){.grid2{grid-template-columns:1fr}}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.switch-row:last-child{border-bottom:none}
.switch-row span{font-size:14px}
.sw{position:relative;width:40px;height:22px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;margin:0}
.sl{position:absolute;inset:0;background:var(--border);border-radius:999px;cursor:pointer;transition:.2s}
.sl::before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.sl{background:var(--accent)}
input:checked+.sl::before{transform:translateX(18px)}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:18px 0 6px}
.tag-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--dim)}
.pill.active{border-color:var(--ok);color:var(--ok)}
.pill.pending{border-color:var(--accent);color:var(--accent)}
.pill.unreg{border-color:var(--border);color:var(--dim)}
.copy-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.copy-row input{flex:1;margin:0;font-size:12px;font-family:monospace}
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{overflow:hidden;padding:0}
.pphoto{width:100%;aspect-ratio:1;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;overflow:hidden}
.pphoto img{width:100%;height:100%;object-fit:cover}
.pbody{padding:13px}
.pbody h4{margin-bottom:3px;font-size:15px}
.pprice{color:var(--accent);font-weight:700;margin:4px 0}
.catalog-controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.catalog-controls input{flex:1;min-width:160px;margin:0}
.catalog-controls select{width:auto;margin:0}
.adm-section{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.adm-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.adm-section h4{margin-bottom:12px;font-size:15px}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
table.dt th,table.dt td{border:1px solid var(--border);padding:5px 7px;text-align:left;white-space:nowrap}
table.dt th{background:var(--panel2)}
.dt-wrap{overflow-x:auto;max-height:340px;overflow-y:auto}
footer{text-align:center;padding:24px 18px 60px;color:var(--dim);font-size:13px}
footer a{margin:0 8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal{background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:24px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto}
.modal h3{margin-bottom:14px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#cookie{position:fixed;bottom:0;left:0;right:0;background:var(--panel2);border-top:1px solid var(--border);padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:70}
#cookie p{font-size:14px;color:var(--dim);margin:0;max-width:540px}
#cookie .ca{display:flex;gap:8px}
#toasts{position:fixed;top:16px;right:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 16px;border-radius:8px;font-size:14px;max-width:320px;animation:tin .2s ease}
.toast-ok{background:var(--ok);color:#0d1f17}
.toast-error{background:var(--danger);color:#fff}
.toast-info{background:var(--accent);color:#12201e}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.scan-card{max-width:460px;margin:40px auto}
.scan-safe{display:flex;align-items:center;gap:8px;background:rgba(76,175,125,.15);border:1px solid var(--ok);border-radius:8px;padding:10px 14px;margin:12px 0;color:var(--ok);font-weight:600}
.info-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .lbl{color:var(--dim);width:130px;flex-shrink:0}
</style>
</head>

function errMsg(r){ return (r && r.code && ERR[r.code] && ERR[r.code][L]) || (r && r.message) || t('networkError'); }
function esc(s)   { return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function hmacHex(keyHex, msg) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(keyHex), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  const s = await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(s)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function keystream(kh, nonce, len) {
  const bytes=[]; let c=0;
  while (bytes.length<len) {
    const h=await hmacHex(kh, nonce+':'+c);
    for (let i=0;i<h.length;i+=2) bytes.push(parseInt(h.substr(i,2),16));
    c++;
  }
  return bytes.slice(0,len);
}
function randHex(n) { const a=new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function encPay(kh, obj) {
  const pt=Array.from(new TextEncoder().encode(JSON.stringify(obj)));
  const n=randHex(16), ks=await keystream(kh,n,pt.length);
  const c=pt.map((b,i)=>(b^ks[i]).toString(16).padStart(2,'0')).join('');
  return {n,c,t:await hmacHex(kh,n+':'+c)};
}
async function decPay(kh, enc) {
  if (await hmacHex(kh,enc.n+':'+enc.c)!==enc.t) throw new Error('Integrity fail');
  const ct=[]; for(let i=0;i<enc.c.length;i+=2) ct.push(parseInt(enc.c.substr(i,2),16));
  const ks=await keystream(kh,enc.n,ct.length);
  return JSON.parse(new TextDecoder().decode(new Uint8Array(ct.map((b,i)=>b^ks[i]))));
}

const LS = {
  g:k=>{try{return localStorage.getItem(k);}catch(_){return null;}},
  s:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}}
};

const SM = {
  at:null, rt:null, ek:null, email:null, fullName:null, role:null, userId:null, _t:null,
  load(){
    this.at=LS.g('at'); this.rt=LS.g('rt'); this.ek=LS.g('ek');
    this.email=LS.g('em'); this.fullName=LS.g('fn'); this.role=LS.g('ro')||''; this.userId=LS.g('uid');
    if (this.at && this.rt) this._sched();
  },
  save(d, email){
    if (email) { this.email=email; LS.s('em',email); }
    if (d.accessToken)   { this.at=d.accessToken;    LS.s('at',d.accessToken); }
    if (d.refreshToken)  { this.rt=d.refreshToken;   LS.s('rt',d.refreshToken); }
    if (d.encryptionKey) { this.ek=d.encryptionKey;  LS.s('ek',d.encryptionKey); }
    if (d.fullName!==undefined)  { this.fullName=d.fullName; LS.s('fn',d.fullName||''); }
    if (d.role!==undefined)      { this.role=d.role;         LS.s('ro',d.role||''); }
    if (d.userId)                { this.userId=d.userId;     LS.s('uid',d.userId); }
    this._sched();
  },
  clear(){
    clearTimeout(this._t);
    this.at=this.rt=this.ek=this.email=this.fullName=this.role=this.userId=null;
    ['at','rt','ek','em','fn','ro','uid'].forEach(k=>localStorage.removeItem(k));
  },
  _sched(){ clearTimeout(this._t); this._t=setTimeout(()=>this._ref(), 4*60*1000+30*1000); },
  async _ref(){
    if (!this.rt||!this.email) return;
    try {
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'refreshSession',payload:{refreshToken:this.rt,email:this.email}})});
      const d=await r.json();
      if (d.success) { this.save(d); }
      else if (d.code==='SESSION_REVOKED'||d.code==='SESSION_EXPIRED') { this.clear(); navigate('login'); toast(t('sessionExpired'),'error'); }
      else { this._sched(); }
    } catch(_){ this._sched(); }
  },
  get ok(){ return !!(this.at&&this.rt); },
  get isAdmin(){ return this.role==='admin'||this.role==='developer'; },
  get isDev()  { return this.role==='developer'; }
};

const API = {
  async call(action, payload, raw){
    payload=Object.assign({},payload||{});
    const body={action};
    if (SM.ek&&SM.at&&!raw) {
      body.tok=SM.at;
      body.enc=await encPay(SM.ek,payload);
    } else {
      if (SM.at) payload.accessToken=SM.at;
      body.payload=payload;
    }
    let data;
    try { const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}); data=await r.json(); }
    catch(_){ return {success:false,code:'NETWORK',message:t('networkError')}; }
    if (data.enc&&SM.ek) {
      try { data=await decPay(SM.ek,data.enc); }
      catch(_){ return {success:false,code:'DECRYPT',message:t('networkError')}; }
    }
    if (data.code==='SESSION_EXPIRED'||data.code==='SESSION_REVOKED') { SM.clear(); navigate('login'); toast(t('sessionExpired'),'error'); }
    return data;
  },
  async pub(params){
    const url=new URL(API_URL);
    Object.keys(params).forEach(k=>url.searchParams.set(k,params[k]));
    try { const r=await fetch(url); return await r.json(); }
    catch(_){ return {success:false,code:'NETWORK',message:t('networkError')}; }
  }
};

async function loadDevSheet(name){
  State._devSheet=name;
  const wrap=document.getElementById('dev-sheet-wrap');
  if (wrap) wrap.innerHTML=`<p class="muted">${t('loading')}</p>`;
  const r=await API.call('adminGetSheet',{sheetName:name});
  if (!wrap||!r.success){if(wrap)wrap.innerHTML=`<div class="alert alert-error">${esc(errMsg(r))}</div>`;return;}
  const cols=r.columns||[], rows=r.rows||[];
  wrap.innerHTML=`<div class="dt-wrap"><table class="dt"><thead><tr>${cols.filter(c=>!c.startsWith('Password')).map(c=>`<th>${esc(c)}</th>`).join('')}<th></th></tr></thead><tbody>
    ${rows.map(row=>`<tr>${cols.filter(c=>!c.startsWith('Password')).map(c=>`<td>${esc(String(row[c]??'').substring(0,80))}</td>`).join('')}
      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="openEditModal(${row._row},'${esc(name)}')" style="margin-right:4px">${t('edit')}</button>
        <button class="btn btn-danger btn-sm" onclick="devDelete(${row._row},'${esc(name)}')">${t('delete')}</button>
      </td></tr>`).join('')}
  </tbody></table></div>`;
}

function openEditModal(row, sheetName){
  const r=API.call('adminGetSheet',{sheetName}).then(res=>{
    if (!res.success) return;
    const rec=res.rows.find(r=>r._row===row);
    if (!rec) return;
    const cols=res.columns.filter(c=>!c.startsWith('Password')&&c!=='_row');
    modal(`<h3>${t('editRecord')}</h3>
      ${cols.map(c=>`<label style="margin-bottom:0">${esc(c)}<input id="ef-${esc(c.replace(/\s/g,'_'))}" value="${esc(String(rec[c]??''))}"></label>`).join('')}
      <div id="ef-alert"></div>
      <div class="modal-btns" style="margin-top:14px">
        <button class="btn btn-primary" onclick="withBtn(this,()=>submitEditRecord(${row},'${esc(sheetName)}',[${cols.map(c=>`'${esc(c)}'`).join(',')}]))">${t('save')}</button>
      </div>`);
  });
}

async function submitEditRecord(row, sheetName, cols){
  const fields={};
  cols.forEach(c=>{ const el=document.getElementById('ef-'+c.replace(/\s/g,'_')); if(el) fields[c]=el.value; });
  const r=await API.call('adminUpdateRecord',{sheetName,row,fields});
  if (r.success){closeModal();loadDevSheet(sheetName);toast(t('saved'),'ok');}
  else showAlert('ef-alert',errMsg(r));
}

async function devDelete(row, sheetName){
  if (!confirm(t('delete')+'?')) return;
  const r=await API.call('adminDeleteRecord',{sheetName,row});
  if (r.success) loadDevSheet(sheetName); else toast(errMsg(r),'error');
}

      ${tag.model==='Pro'&&tag.meetingSpot?`<div class="info-row"><span class="lbl">${t_('meetingSpot')}</span>${esc(tag.meetingSpot)}</div>`:''}

  SM.save(lr,email);
  await doActivate();

async function doActivate(){
  const p=State._tagParams||{};
  const r=await API.call('activateTag',{tagId:p.tagId,key:p.key});
  if (r.success){showAlert('act-alert',t('activationOk'),'ok');setTimeout(()=>navigate('dashboard'),1500);}
  else showAlert('act-alert',errMsg(r));

async function init(){
  initCookies();
  SM.load();
  const params=new URLSearchParams(window.location.search);
  const resetTok=params.get('reset');
  const setupTok=params.get('setup');
  const uid=params.get('uid');
  const key=params.get('key');
  const tagId=params.get('tag_id');
  const isActivation=params.get('activation')==='1';

  if (resetTok&&uid){ State._resetParams={token:resetTok,uid}; State.view='resetForm'; render(); return; }
  if (setupTok&&uid){ State._setupParams={token:setupTok,uid}; State.view='setup'; render(); return; }
  if (key&&tagId){
    const res=await API.pub({key,tag_id:tagId});
    State._tagResult=res; State._tagParams={key,tagId};
    if (res.success&&res.tag&&res.tag.status==='Pending Activation') State.view='activation';
    else if (isActivation) State.view='activation';
    else State.view='tagScan';
    render(); return;
  }
  State.view=SM.ok?'dashboard':'landing';
  render();
}

init();
